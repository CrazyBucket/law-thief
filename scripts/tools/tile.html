<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Isometric Converter</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    gap: 24px;
  }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: 1px; color: #a0c4ff; }

  #drop-zone {
    width: 360px;
    height: 140px;
    border: 2px dashed #4a4a7a;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    color: #888;
    font-size: 14px;
  }
  #drop-zone:hover, #drop-zone.drag-over {
    border-color: #a0c4ff;
    background: #1e1e3a;
    color: #a0c4ff;
  }
  #drop-zone svg { opacity: 0.5; }

  .controls {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .controls label { color: #aaa; }
  .controls input[type=number] {
    width: 80px;
    padding: 6px 10px;
    background: #2a2a4a;
    border: 1px solid #4a4a7a;
    border-radius: 6px;
    color: #e0e0e0;
    font-size: 14px;
    text-align: center;
  }
  .controls input[type=number]:focus { outline: none; border-color: #a0c4ff; }

  /* 朝向选择器 */
  .dir-group {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .dir-group label { color: #aaa; margin-right: 4px; }
  .dir-btn {
    width: 44px;
    height: 44px;
    background: #2a2a4a;
    border: 1px solid #4a4a7a;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    transition: border-color 0.15s, background 0.15s;
    padding: 0;
  }
  .dir-btn:hover { border-color: #a0c4ff; background: #1e1e3a; }
  .dir-btn.active { border-color: #a0c4ff; background: #2a3a6a; }
  .dir-btn svg { display: block; }
  .dir-btn span { font-size: 9px; color: #888; line-height: 1; }
  .dir-btn.active span { color: #a0c4ff; }

  .preview-row {
    display: flex;
    gap: 32px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }
  .preview-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .preview-box span { font-size: 12px; color: #666; }
  canvas {
    border-radius: 6px;
    background: repeating-conic-gradient(#2a2a3a 0% 25%, #222230 0% 50%) 0 0 / 16px 16px;
    max-width: 480px;
    max-height: 320px;
    image-rendering: pixelated;
  }

  #download-btn {
    padding: 10px 28px;
    background: #3a5a9a;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
    display: none;
  }
  #download-btn:hover { background: #4a6aaa; }
  #status { font-size: 13px; color: #666; min-height: 20px; }
</style>
</head>
<body>

<h1>⬡ Isometric Converter</h1>

<div id="drop-zone">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="17 8 12 3 7 8"/>
    <line x1="12" y1="3" x2="12" y2="15"/>
  </svg>
  <span>拖入图片 或 点击选择</span>
  <span style="font-size:12px">支持 PNG / JPG / WebP</span>
  <input type="file" id="file-input" accept="image/*" style="display:none">
</div>

<div class="controls">
  <label>输出宽度</label>
  <input type="number" id="out-width" value="512" min="32" max="4096" step="32">
  <label>px</label>

  <div style="width:1px;height:24px;background:#3a3a5a"></div>

  <!-- 4 方向按钮：北/东/南/西，对应原图旋转 0/90/180/270° -->
  <div class="dir-group">
    <label>朝向</label>
    <button class="dir-btn active" data-rot="0"   title="北（原图）">
      <!-- 菱形朝上箭头 -->
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <polygon points="11,2 20,11 11,20 2,11" stroke="#a0c4ff" stroke-width="1.5" fill="none"/>
        <polyline points="11,14 11,8 8,11" stroke="#a0c4ff" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
        <line x1="11" y1="8" x2="14" y2="11" stroke="#a0c4ff" stroke-width="1.5"/>
      </svg>
      <span>北</span>
    </button>
    <button class="dir-btn" data-rot="90"  title="东（顺时针90°）">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <polygon points="11,2 20,11 11,20 2,11" stroke="#666" stroke-width="1.5" fill="none"/>
        <polyline points="8,11 14,11 11,8" stroke="#666" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
        <line x1="14" y1="11" x2="11" y2="14" stroke="#666" stroke-width="1.5"/>
      </svg>
      <span>东</span>
    </button>
    <button class="dir-btn" data-rot="180" title="南（顺时针180°）">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <polygon points="11,2 20,11 11,20 2,11" stroke="#666" stroke-width="1.5" fill="none"/>
        <polyline points="11,8 11,14 14,11" stroke="#666" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
        <line x1="11" y1="14" x2="8" y2="11" stroke="#666" stroke-width="1.5"/>
      </svg>
      <span>南</span>
    </button>
    <button class="dir-btn" data-rot="270" title="西（顺时针270°）">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <polygon points="11,2 20,11 11,20 2,11" stroke="#666" stroke-width="1.5" fill="none"/>
        <polyline points="14,11 8,11 11,14" stroke="#666" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
        <line x1="8" y1="11" x2="11" y2="8" stroke="#666" stroke-width="1.5"/>
      </svg>
      <span>西</span>
    </button>
  </div>
</div>

<div class="preview-row">
  <div class="preview-box">
    <canvas id="src-canvas"></canvas>
    <span id="src-info"></span>
  </div>
  <div class="preview-box">
    <canvas id="dst-canvas"></canvas>
    <span id="dst-info"></span>
  </div>
</div>

<button id="download-btn">⬇ 下载 PNG</button>
<div id="status">等待图片…</div>

<script>
const dropZone   = document.getElementById('drop-zone');
const fileInput  = document.getElementById('file-input');
const outWidthEl = document.getElementById('out-width');
const srcCanvas  = document.getElementById('src-canvas');
const dstCanvas  = document.getElementById('dst-canvas');
const srcInfo    = document.getElementById('src-info');
const dstInfo    = document.getElementById('dst-info');
const dlBtn      = document.getElementById('download-btn');
const status     = document.getElementById('status');
const dirBtns    = document.querySelectorAll('.dir-btn');

let currentImage = null;
let currentRot   = 0;   // 0 / 90 / 180 / 270

// ── 朝向按钮 ─────────────────────────────────────────────────────────────────
dirBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    dirBtns.forEach(b => {
      b.classList.remove('active');
      b.querySelectorAll('[stroke]').forEach(el => el.setAttribute('stroke', '#666'));
    });
    btn.classList.add('active');
    btn.querySelectorAll('[stroke]').forEach(el => el.setAttribute('stroke', '#a0c4ff'));
    currentRot = parseInt(btn.dataset.rot);
    if (currentImage) convert(currentImage);
  });
});

// ── 拖拽 & 点击上传 ──────────────────────────────────────────────────────────
dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => loadFile(e.target.files[0]));
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  loadFile(e.dataTransfer.files[0]);
});
outWidthEl.addEventListener('change', () => { if (currentImage) convert(currentImage); });

function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => { currentImage = img; convert(img); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// ── 旋转源图到临时 canvas，返回 ImageData ────────────────────────────────────
function getRotatedSrcData(img, n, rot) {
  const tmp = document.createElement('canvas');
  tmp.width = tmp.height = n;
  const ctx = tmp.getContext('2d');
  ctx.save();
  ctx.translate(n / 2, n / 2);
  ctx.rotate(rot * Math.PI / 180);
  ctx.drawImage(img, 0, 0, n, n, -n / 2, -n / 2, n, n);
  ctx.restore();
  return ctx.getImageData(0, 0, n, n).data;
}

// ── 核心变换 ─────────────────────────────────────────────────────────────────
function convert(img) {
  status.textContent = '转换中…';

  const n = Math.min(img.width, img.height);

  // 源图预览（显示旋转后的）
  srcCanvas.width = srcCanvas.height = n;
  const sCtx = srcCanvas.getContext('2d');
  sCtx.save();
  sCtx.translate(n / 2, n / 2);
  sCtx.rotate(currentRot * Math.PI / 180);
  sCtx.drawImage(img, 0, 0, n, n, -n / 2, -n / 2, n, n);
  sCtx.restore();
  srcInfo.textContent = `原图 ${n}×${n}  旋转 ${currentRot}°`;

  const srcData = getRotatedSrcData(img, n, currentRot);

  const outW = Math.max(32, parseInt(outWidthEl.value) || 512);
  const outH = outW >> 1;

  dstCanvas.width  = outW;
  dstCanvas.height = outH;
  const dCtx  = dstCanvas.getContext('2d');
  const dstImg = dCtx.createImageData(outW, outH);
  const dst   = dstImg.data;

  const upscaling = outW > n * 2;
  const px = n / outW;
  const py = n / outH;

  for (let dy = 0; dy < outH; dy++) {
    const v = dy / outH;
    for (let dx = 0; dx < outW; dx++) {
      const u = dx / outW;

      const sx = (u - 0.5 + v) * n;
      const sy = (v - u + 0.5) * n;

      const cov = clamp(sx / px + 0.5) *
                  clamp(((n - 1) - sx) / px + 0.5) *
                  clamp(sy / py + 0.5) *
                  clamp(((n - 1) - sy) / py + 0.5);

      if (cov <= 0) continue;

      let r, g, b, a;
      if (upscaling) {
        const ix = Math.min(Math.max(0, Math.round(sx)), n - 1);
        const iy = Math.min(Math.max(0, Math.round(sy)), n - 1);
        const i  = (iy * n + ix) * 4;
        r = srcData[i]; g = srcData[i+1]; b = srcData[i+2]; a = srcData[i+3];
      } else {
        const x0 = Math.max(0, Math.min(n-1, Math.floor(sx)));
        const y0 = Math.max(0, Math.min(n-1, Math.floor(sy)));
        const x1 = Math.min(n-1, x0+1);
        const y1 = Math.min(n-1, y0+1);
        const fx = sx - x0, fy = sy - y0;
        const i00=(y0*n+x0)*4, i10=(y0*n+x1)*4, i01=(y1*n+x0)*4, i11=(y1*n+x1)*4;
        const w00=(1-fx)*(1-fy), w10=fx*(1-fy), w01=(1-fx)*fy, w11=fx*fy;
        r = srcData[i00]*w00+srcData[i10]*w10+srcData[i01]*w01+srcData[i11]*w11;
        g = srcData[i00+1]*w00+srcData[i10+1]*w10+srcData[i01+1]*w01+srcData[i11+1]*w11;
        b = srcData[i00+2]*w00+srcData[i10+2]*w10+srcData[i01+2]*w01+srcData[i11+2]*w11;
        a = srcData[i00+3]*w00+srcData[i10+3]*w10+srcData[i01+3]*w01+srcData[i11+3]*w11;
      }

      const o = (dy * outW + dx) * 4;
      dst[o]=r; dst[o+1]=g; dst[o+2]=b; dst[o+3]=a*cov;
    }
  }

  dCtx.putImageData(dstImg, 0, 0);
  dstInfo.textContent = `输出 ${outW}×${outH}`;
  dlBtn.style.display = 'block';
  status.textContent  = '✓ 转换完成';
}

function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

dlBtn.addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = `isometric_${currentRot}deg.png`;
  a.href = dstCanvas.toDataURL('image/png');
  a.click();
});
</script>
</body>
</html>
