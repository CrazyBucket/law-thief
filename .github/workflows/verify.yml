name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.6.3"
          use-dotnet: false
      - name: Verify all
        run: ./tools/verify all

  export-linux:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.6.3"
          use-dotnet: false
      - name: Export Linux build
        run: ./tools/export_build Linux
      - name: Smoke exported build
        run: |
          chmod +x ./build/linux/law-thief.x86_64
          timeout 10s xvfb-run --auto-servernum ./build/linux/law-thief.x86_64 --headless --quit-after 1
