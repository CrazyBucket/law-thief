name: verify

on:
  workflow_dispatch:
  pull_request:
  push:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DESIGN_ROOT: ${{ github.workspace }}/design-source/game/design/law-thief
      DESIGN_SYNC_REQUIRED: "1"
      SEMANTIC_COVERAGE_MIN: "87.17"
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout design authority
        uses: actions/checkout@v4
        with:
          repository: CrazyBucket/learning-notes
          ref: ${{ vars.DESIGN_REPOSITORY_REF || 'main' }}
          path: design-source
          token: ${{ secrets.LEARNING_NOTES_TOKEN || github.token }}
          persist-credentials: false
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.6.3"
          use-dotnet: false
      - name: Verify all
        run: ./tools/verify all

  export-linux:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.6.3"
          use-dotnet: false
          include-templates: true
      - name: Export Linux build
        run: ./tools/export_build Linux
      - name: Smoke exported build
        run: |
          chmod +x ./build/linux/law-thief.x86_64
          timeout 10s xvfb-run --auto-servernum ./build/linux/law-thief.x86_64 --headless --quit-after 1
